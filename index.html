<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Notes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<div id="app"></div>

<header class="header">
    <h1>NOTES</h1>

    <p class="notes-count">
        Всего заметок: <span id="notes-count">0</span>
    </p>
</header>

<main>

    <form class="note-form" name="notes">
        <label for="note-title">
            Название заметки
        </label>

        <input
                id="note-title"
                type="text"
                name="title"
                placeholder="Введите заголовок..."
        >

        <label for="note-content">
            Описание новой заметки
        </label>

        <textarea
                id="note-content"
                name="content"
                placeholder="Введите текст заметки..."
        ></textarea>
        <div class="form-bottom">
         <fieldset class="fieldset">
            <legend class="label">Выберите цвет заметки</legend>
            <ul class="radio-list">
                <li>
                    <input checked class="radio" type="radio" name="color" value="yellow" aria-label="yellow" />
                </li>
                <li>
                    <input class="radio" type="radio" name="color" value="red" aria-label="red" />
                </li>
                <li>
                    <input class="radio" type="radio" name="color" value="green" aria-label="green" />
                </li>
                <li>
                    <input class="radio" type="radio" name="color" value="blue" aria-label="blue" />
                </li>
                <li>
                    <input class="radio" type="radio" name="color" value="purple" aria-label="purple" />
                </li>
            </ul>
         </fieldset>
         <button type="submit">
            Добавить заметку
         </button>
        </div>
    </form>

    <div class="filter-box">
        <label>
            <input
                    type="checkbox"
                    id="favorite-filter"
            >
            Показать только избранные заметки
        </label>
    </div>

    <ul class="notes-list">
        <!-- Сюда будут рендериться заметки из JavaScript -->
    </ul>

    <div class="messages-box">
        <!-- Сюда будут рендериться информационные сообщения -->
    </div>

</main>

</div>

<script src="js/index.js"></script>

</body>
</html>
